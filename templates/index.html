<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quinn AI</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0A0A0A;
    color: #E2E8F0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .container {
    width: 100%;
    max-width: 720px;
    height: 90vh;
    display: flex;
    flex-direction: column;
    border: 1px solid #1E293B;
    border-radius: 12px;
    overflow: hidden;
  }
  header {
    padding: 16px 24px;
    background: #0F172A;
    border-bottom: 1px solid #1E293B;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 16px; font-weight: 600; color: #C8FF00; }
  header span { font-size: 11px; color: #475569; font-family: monospace; }
  #reset-btn {
    background: none;
    border: 1px solid #1E293B;
    color: #475569;
    font-size: 11px;
    padding: 4px 10px;
    cursor: pointer;
    border-radius: 4px;
    font-family: monospace;
    transition: color 0.15s;
  }
  #reset-btn:hover { color: #E2E8F0; }
  #chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .message {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.6;
  }
  .user {
    align-self: flex-end;
    background: #1D4ED8;
    color: #E2E8F0;
  }
  .quinn {
    align-self: flex-start;
    background: #0F172A;
    border: 1px solid #1E293B;
    color: #CBD5E1;
  }
  .quinn .label {
    font-size: 10px;
    color: #C8FF00;
    font-family: monospace;
    margin-bottom: 6px;
    letter-spacing: 0.06em;
  }
  .typing {
    align-self: flex-start;
    background: #0F172A;
    border: 1px solid #1E293B;
    color: #475569;
    font-size: 14px;
    padding: 12px 16px;
    border-radius: 8px;
    font-family: monospace;
  }
  footer {
    padding: 16px 24px;
    background: #0F172A;
    border-top: 1px solid #1E293B;
    display: flex;
    gap: 12px;
  }
  #user-input {
    flex: 1;
    background: #0A0A0A;
    border: 1px solid #1E293B;
    color: #E2E8F0;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  #user-input:focus { border-color: #3B82F6; }
  #send-btn {
    background: #C8FF00;
    color: #0A0A0A;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  #send-btn:hover { opacity: 0.85; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>QUINN AI</h1>
    <button id="reset-btn">RESET</button>
  </header>
  <div id="chat-box"></div>
  <footer>
    <input type="text" id="user-input" placeholder="Ask Quinn anything..." autocomplete="off">
    <button id="send-btn">SEND</button>
  </footer>
</div>

<script>
  const chatBox = document.getElementById('chat-box');
  const input = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const resetBtn = document.getElementById('reset-btn');

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.classList.add('message', role);
    if (role === 'quinn') {
      div.innerHTML = `<div class="label">QUINN</div>${text}`;
    } else {
      div.textContent = text;
    }
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.classList.add('typing');
    div.id = 'typing';
    div.textContent = '...';
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    sendBtn.disabled = true;
    addMessage('user', text);
    addTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      removeTyping();
      if (data.error) {
        addMessage('quinn', `Error: ${data.error}`);
      } else {
        addMessage('quinn', data.reply);
      }
    } catch (err) {
      removeTyping();
      addMessage('quinn', 'Something went wrong. Please try again.');
    }

    sendBtn.disabled = false;
    input.focus();
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

  resetBtn.addEventListener('click', async () => {
    await fetch('/reset', { method: 'POST' });
    chatBox.innerHTML = '';
  });
</script>
</body>
</html>
